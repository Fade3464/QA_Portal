services:
  db:
    image: postgres:17-alpine
    restart: unless-stopped
    environment:
      POSTGRES_DB: ${POSTGRES_DB:-qa_portal}
      POSTGRES_USER: ${POSTGRES_USER:-qa_portal}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:-qa_portal_dev_only}
    volumes:
      - postgres_data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U $${POSTGRES_USER} -d $${POSTGRES_DB}"]
      interval: 5s
      timeout: 5s
      retries: 10
    networks: [internal]

  redis:
    image: redis:8-alpine
    restart: unless-stopped
    command: ["redis-server", "--appendonly", "yes"]
    volumes:
      - redis_data:/data
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 5s
      timeout: 3s
      retries: 10
    networks: [internal]

  backend:
    build: ./backend
    restart: unless-stopped
    env_file:
      - path: .env
        required: false
    environment:
      DATABASE_URL: postgresql://${POSTGRES_USER:-qa_portal}:${POSTGRES_PASSWORD:-qa_portal_dev_only}@db:5432/${POSTGRES_DB:-qa_portal}
      REDIS_URL: redis://redis:6379/0
      CELERY_BROKER_URL: redis://redis:6379/0
      CELERY_RESULT_BACKEND: redis://redis:6379/1
      RECORDINGS_ROOT: /recordings
    volumes:
      - recordings:/recordings
    read_only: true
    tmpfs:
      - /tmp
    security_opt:
      - no-new-privileges:true
    depends_on:
      db: { condition: service_healthy }
      redis: { condition: service_healthy }
    healthcheck:
      test: ["CMD", "python", "-c", "import urllib.request; urllib.request.urlopen('http://127.0.0.1:8000/api/health/', timeout=3)"]
      interval: 10s
      timeout: 5s
      retries: 10
    networks: [internal]

  worker:
    build: ./backend
    restart: unless-stopped
    command: ["celery", "-A", "config", "worker", "--loglevel=INFO", "--queues=recordings", "--concurrency=2", "--prefetch-multiplier=1", "--max-tasks-per-child=500"]
    stop_grace_period: 5m
    env_file:
      - path: .env
        required: false
    environment:
      DATABASE_URL: postgresql://${POSTGRES_USER:-qa_portal}:${POSTGRES_PASSWORD:-qa_portal_dev_only}@db:5432/${POSTGRES_DB:-qa_portal}
      REDIS_URL: redis://redis:6379/0
      CELERY_BROKER_URL: redis://redis:6379/0
      CELERY_RESULT_BACKEND: redis://redis:6379/1
      RECORDINGS_ROOT: /recordings
    volumes:
      - recordings:/recordings
    read_only: true
    tmpfs:
      - /tmp
    security_opt:
      - no-new-privileges:true
    depends_on:
      backend: { condition: service_healthy }
    networks: [internal]

  frontend:
    build: ./frontend
    restart: unless-stopped
    ports:
      - "${PORTAL_PORT:-8080}:80"
    depends_on:
      backend: { condition: service_healthy }
    networks: [internal]

networks:
  internal:
    driver: bridge

volumes:
  postgres_data:
  redis_data:
  recordings:
