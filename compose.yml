services:
  db:
    image: postgres:17-alpine
    restart: unless-stopped
    environment:
      POSTGRES_DB: ${POSTGRES_DB:-qa_portal}
      POSTGRES_USER: ${POSTGRES_USER:-qa_portal}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:-qa_portal_dev_only}
    volumes:
      - postgres_data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U $${POSTGRES_USER} -d $${POSTGRES_DB}"]
      interval: 5s
      timeout: 5s
      retries: 10
    networks: [internal]

  redis:
    image: redis:8-alpine
    restart: unless-stopped
    command: ["redis-server", "--appendonly", "yes"]
    volumes:
      - redis_data:/data
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 5s
      timeout: 3s
      retries: 10
    networks: [internal]

  backend:
    build: ./backend
    restart: unless-stopped
    env_file:
      - path: .env
        required: false
    environment:
      PRODUCTION: ${PRODUCTION:-false}
      DATABASE_URL: postgresql://${POSTGRES_USER:-qa_portal}:${POSTGRES_PASSWORD:-qa_portal_dev_only}@db:5432/${POSTGRES_DB:-qa_portal}
      REDIS_URL: redis://redis:6379/0
      CACHE_URL: redis://redis:6379/2
      CELERY_BROKER_URL: redis://redis:6379/0
      CELERY_RESULT_BACKEND: redis://redis:6379/1
      TIME_ZONE: ${TIME_ZONE:-America/New_York}
      TZ: ${TIME_ZONE:-America/New_York}
      RECORDINGS_ROOT: /recordings
      MEDIA_ROOT: /media
      RECORDING_DOWNLOAD_VERIFY_TLS: ${RECORDING_DOWNLOAD_VERIFY_TLS:-false}
    volumes:
      - recordings:/recordings
      - profile_media:/media
    read_only: true
    tmpfs:
      - /tmp
    security_opt:
      - no-new-privileges:true
    depends_on:
      db: { condition: service_healthy }
      redis: { condition: service_healthy }
    healthcheck:
      test: ["CMD", "python", "-c", "import urllib.request; urllib.request.urlopen('http://127.0.0.1:8000/api/health/', timeout=3)"]
      interval: 10s
      timeout: 5s
      retries: 10
    networks: [internal]

  worker:
    build: ./backend
    restart: unless-stopped
    # Consume the legacy default queue while the pre-fix recording backlog
    # drains. New recording tasks are routed to the recordings queue.
    command: ["celery", "-A", "config", "worker", "--loglevel=INFO", "--queues=recordings,celery", "--concurrency=2", "--prefetch-multiplier=1", "--max-tasks-per-child=500"]
    stop_grace_period: 5m
    env_file:
      - path: .env
        required: false
    environment:
      PRODUCTION: ${PRODUCTION:-false}
      DATABASE_URL: postgresql://${POSTGRES_USER:-qa_portal}:${POSTGRES_PASSWORD:-qa_portal_dev_only}@db:5432/${POSTGRES_DB:-qa_portal}
      REDIS_URL: redis://redis:6379/0
      CACHE_URL: redis://redis:6379/2
      CELERY_BROKER_URL: redis://redis:6379/0
      CELERY_RESULT_BACKEND: redis://redis:6379/1
      TIME_ZONE: ${TIME_ZONE:-America/New_York}
      TZ: ${TIME_ZONE:-America/New_York}
      RECORDINGS_ROOT: /recordings
      RECORDING_DOWNLOAD_VERIFY_TLS: ${RECORDING_DOWNLOAD_VERIFY_TLS:-false}
    volumes:
      - recordings:/recordings
    read_only: true
    tmpfs:
      - /tmp
    security_opt:
      - no-new-privileges:true
    depends_on:
      backend: { condition: service_healthy }
    networks: [internal]

  frontend:
    build:
      context: ./frontend
      args:
        VITE_APP_TIME_ZONE: ${TIME_ZONE:-America/New_York}
    restart: unless-stopped
    environment:
      TZ: ${TIME_ZONE:-America/New_York}
    ports:
      - "${PORTAL_PORT:-8080}:80"
    depends_on:
      backend: { condition: service_healthy }
    healthcheck:
      test: ["CMD-SHELL", "wget -q -T 3 -O /dev/null http://127.0.0.1/api/health/"]
      interval: 10s
      timeout: 5s
      retries: 6
      start_period: 10s
    networks: [internal]

  cloudflared:
    build: ./cloudflared
    restart: on-failure
    environment:
      PRODUCTION: ${PRODUCTION:-false}
      CLOUDFLARED_ORIGIN_URL: http://frontend:80
      CLOUDFLARED_URL_FILE: /runtime/cloudflared-url.txt
    volumes:
      - ./runtime:/runtime
    read_only: true
    tmpfs:
      - /tmp
    cap_drop:
      - ALL
    # The entrypoint needs DAC_OVERRIDE to initialize the UID-1000-owned bind
    # mount, then SETUID/SETGID solely to drop to the non-root tunnel user.
    cap_add:
      - DAC_OVERRIDE
      - SETGID
      - SETUID
    security_opt:
      - no-new-privileges:true
    depends_on:
      frontend: { condition: service_healthy }
    networks: [internal]

networks:
  internal:
    driver: bridge

volumes:
  postgres_data:
  redis_data:
  recordings:
  profile_media:
